# yaml-language-server: $schema=https://raw.githubusercontent.com/Azure/azure-dev/main/schemas/v1.0/azure.yaml.json

name: terra
metadata:
    template: azd-init@1.24.3
services:
    json-server:
        project: terra-backend/json-server
        host: containerapp
        language: js
        docker:
            path: Dockerfile
    python-server:
        project: terra-backend/python-server
        host: containerapp
        language: python
        docker:
            path: Dockerfile
    terra-update-batch:
        project: terra-update-batch
        host: containerapp
        language: python
        docker:
            path: Dockerfile
    frontend:
        project: terra-frontend
        host: staticwebapp
        language: js

resources:
    json-server:
        type: host.containerapp
        port: 5300
    python-server:
        type: host.containerapp
        port: 5500
    terra-update-batch:
        type: host.containerapp
        port: 80
hooks:
    preprovision:
        windows:
            shell: pwsh
            continueOnError: false
            interactive: false
            run: if (test-path .azure/$env:AZURE_ENV_NAME/resnames.json) { cp .azure/$env:AZURE_ENV_NAME/resnames.json .azure/.resnames.json } else { '{}' > .azure/.resnames.json }
        posix:
            shell: sh
            continueOnError: false
            interactive: false
            run: if [ -n .azure/${AZURE_ENV_NAME}/resnames.json ] ; then cp .azure/${AZURE_ENV_NAME}/resnames.json .azure/.resnames.json ; else '{}' > .azure/.resnames.json ; fi
