# yaml-language-server: $schema=https://raw.githubusercontent.com/Azure/azure-dev/main/schemas/v1.0/azure.yaml.json

name: terra
metadata:
    template: azd-init@1.24.3
services:
    json-server:
        project: terra-backend/json-server
        host: containerapp
        language: js
        docker:
            path: Dockerfile
            buildArgs:
            - NPM_REPO_URL=${CUSTOM_NPM_REPO_URL}
    python-server:
        project: terra-backend/python-server
        host: containerapp
        language: python
        docker:
            path: Dockerfile
            buildArgs:
            - PIP_REPO_URL=${CUSTOM_PIP_REPO_URL}
    terra-update-batch:
        project: terra-update-batch
        host: containerapp
        language: python
        docker:
            path: Dockerfile
            buildArgs:
            - PIP_REPO_URL=${CUSTOM_PIP_REPO_URL}
    frontend:
        project: terra-frontend
        host: staticwebapp
        language: js
#        dist: dist

resources:
    json-server:
        type: host.containerapp
        port: 5300
    python-server:
        type: host.containerapp
        port: 5500
    terra-update-batch:
        type: host.containerapp
        port: 80

hooks:
    preprovision:
        shell: pwsh
        continueOnError: false
        interactive: false
        run: | 
            # Resnames
            if (test-path .azure/$env:AZURE_ENV_NAME/resnames.json) { 
                cp .azure/$env:AZURE_ENV_NAME/resnames.json .azure/.resnames.json 
            } else { 
                cp resnames.empty.json .azure/.resnames.json 
            }

            # Create a random secure password
            $PasswordLength = 20
            if ([string]::IsNullOrWhitespace($Env:AZURE_PRINCIPAL_SID)) {
                do {
                    $securePassword = (1..$PasswordLength | ForEach-Object { [char]((64..90) + (97..122) + (48..57) + ('#', '!', '$', '%') | Get-Random) }) -join ''
                    $complexityCount = 0
                    if ($securePassword -match '[A-Z]') { $complexityCount++ }
                    if ($securePassword -match '[a-z]') { $complexityCount++ }
                    if ($securePassword -match '[0-9]') { $complexityCount++ }
                    if ($securePassword -match '[!$#%]') { $complexityCount++ }
                    if ($securePassword -match '^[!$#%]|[!$#%]$') { $complexityCount = 0 }
                } while ($complexityCount -lt 3)

                azd env set SQL_ADMIN_PASSWORD $securePassword
            }

            # Obtain current principal OID
            $token = azd auth token
            $claimsb64url = $token.Split('.')[1]
            $claimsJsonBinary = [System.Buffers.Text.Base64Url]::DecodeFromChars($claimsB64url)
            $claimsJson = [Text.Encoding]::UTF8.GetString($claimsJsonBinary)
            $claims = $claimsjson | ConvertFrom-Json
            azd env set AZURE_PRINCIPAL_SID $($claims.oid)

    postprovision:
        shell: pwsh
        run: |
            scripts/add-entrauser.ps1 -SqlServerHostName -SqlDbName -ManagedIdentityName -DbRole 

