# yaml-language-server: $schema=https://raw.githubusercontent.com/Azure/azure-dev/main/schemas/v1.0/azure.yaml.json

name: terra
metadata:
    template: azd-init@1.24.3
services:
    json-server:
        project: terra-backend/json-server
        host: containerapp
        language: js
        docker:
            path: Dockerfile
    python-server:
        project: terra-backend/python-server
        host: containerapp
        language: python
        docker:
            path: Dockerfile
    terra-update-batch:
        project: terra-update-batch
        host: containerapp
        language: python
        docker:
            path: Dockerfile
#    frontend:
#        project: terra-frontend
#        host: staticwebapp
#        language: js
#        dist: dist


resources:
    json-server:
        type: host.containerapp
        port: 5300
    python-server:
        type: host.containerapp
        port: 5500
    terra-update-batch:
        type: host.containerapp
        port: 80
hooks:
    preprovision:
        windows:
            shell: pwsh
            continueOnError: false
            interactive: false
            run: | 
              if (test-path .azure/$env:AZURE_ENV_NAME/resnames.json) { 
                 cp .azure/$env:AZURE_ENV_NAME/resnames.json .azure/.resnames.json 
              } else { 
                 '{}' > .azure/.resnames.json 
              }

              $token = azd auth token
              $claimsb64url = $token.Split('.')[1]
              $claimsJsonBinary = [System.Buffers.Text.Base64Url]::DecodeFromChars($claimsB64url)
              $claimsJson = [Text.Encoding]::UTF8.GetString($claimsJsonBinary)
              $claims = $claimsjson | ConvertFrom-Json
              azd env set AZURE_PRINCIPAL_SID $($claims.oid)
        posix:
            shell: sh
            continueOnError: false
            interactive: false
            run: if [ -n .azure/${AZURE_ENV_NAME}/resnames.json ] ; then cp .azure/${AZURE_ENV_NAME}/resnames.json .azure/.resnames.json ; else '{}' > .azure/.resnames.json ; fi
    postprovision:
        shell: pwsh
        run: |
          scripts/add-entrauser.ps1 -SqlServerHostName -SqlDbName -ManagedIdentityName -DbRole 
    prepackage:
        run: cd terra-frontend ; npm run build
    predeploy:
        posix: 
            run: npx -y @azure/static-web-apps-cli@latest deploy terra-frontend/dist --verbose silly -R ${AZURE_RESOURCE_GROUP} -n ${AZURE_RESOURCE_TERRA_FRONTEND_NAME}
        windows: 
            run: npx -y @azure/static-web-apps-cli@latest deploy terra-frontend/dist --verbose silly -R $env:AZURE_RESOURCE_GROUP -n $env:AZURE_RESOURCE_TERRA_FRONTEND_NAME
            interactive: true


