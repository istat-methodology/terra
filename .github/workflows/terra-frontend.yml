name: Terra Frontend CI/CD

on:
  workflow_dispatch:

jobs:
  build_and_deploy_job_development:
    runs-on: ubuntu-latest
    name: Build and Deploy Job - Development
    permissions:
      contents: read
      id-token: write
    environment: 
      name: development
      url: ${{ steps.builddeploy.outputs.static_web_app_url }}
    steps:
      - uses: actions/checkout@v2
        with:
          submodules: true
      - name: Remove access restrictions in staticwebapp.config.json
        shell: pwsh
        run: |
           $config = Get-Content terra-frontend/staticwebapp.config.json | ConvertFrom-Json
           $config.forwardingGateway = $null
           $config.networking = $null
           $config | ConvertTo-Json -Depth 4 | Out-File terra-frontend/staticwebapp.config.json
           Get-Content terra-frontend/staticwebapp.config.json
      - name: Insert version (run)
        shell: pwsh
        run: Set-Content -Path terra-frontend/public/version.txt -Value $Env:GITHUB_RUN_NUMBER -Encoding utf8
      - name: Azure login with OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - name: Get Static Web App deployment token
        id: deployment_token
        shell: pwsh
        env:
          AZURE_RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
        run: |
          if ([string]::IsNullOrWhiteSpace($Env:AZURE_RESOURCE_GROUP)) {
            throw 'AZURE_RESOURCE_GROUP must be configured'
          }
          
          $appName = az staticwebapp list `
            --resource-group $Env:AZURE_RESOURCE_GROUP `
            --query '[0].name' --output tsv --only-show-errors
          
          if ($LASTEXITCODE -ne 0) {
            throw 'Failed to list Static Web Apps'
          }
          
          if ([string]::IsNullOrWhiteSpace($appName) -or $appName -eq 'null') {
            throw "No Static Web App found in resource group $Env:AZURE_RESOURCE_GROUP"
          }
          
          $token = az staticwebapp secrets list `
            --name $appName `
            --resource-group $Env:AZURE_RESOURCE_GROUP `
            --query properties.apiKey --output tsv --only-show-errors
          
          if ($LASTEXITCODE -ne 0) {
            throw 'Failed to retrieve Static Web App deployment token'
          }
          if ([string]::IsNullOrWhiteSpace($token) -or $token -eq 'null') {
            throw 'Azure returned an empty Static Web App deployment token'
          }
          
          Write-Output "::add-mask::$token"
          Add-Content -Path $Env:GITHUB_OUTPUT -Value "token=$token" -Encoding utf8

      - name: Build And Deploy for env development
        id: builddeploy
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ steps.deployment_token.outputs.token }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: "upload"
          app_location: "/terra-frontend"
          api_location: ""
          app_build_command: "npm run build -- --mode development"
          output_location: "dist"
          deployment_environment: "development"

  build_and_deploy_job_production:
    if: ${{ github.ref_name == 'main' }}
    runs-on: ubuntu-latest
    needs: build_and_deploy_job_development
    name: Build and Deploy Job - Production
    permissions:
      contents: read
      id-token: write
    environment: 
      name: production
      url: https://www.terra.statlab.it
    steps:
      - uses: actions/checkout@v2
        with:
          submodules: true
      - name: Insert FDID in staticwebapp.config.json
        shell: pwsh
        env:
           FDID: ${{ secrets.FRONTDOORID }}
        run: |
           $config = Get-Content terra-frontend/staticwebapp.config.json | ConvertFrom-Json
           $config.forwardingGateway.requiredHeaders.'X-Azure-FDID' = $Env:FDID
           $config | ConvertTo-Json -Depth 4 | Out-File terra-frontend/staticwebapp.config.json
           Get-Content terra-frontend/staticwebapp.config.json
      - name: Insert version (run)
        shell: pwsh
        run: Set-Content -Path terra-frontend/public/version.txt -Value $Env:GITHUB_RUN_NUMBER -Encoding utf8
      - name: Azure login with OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - name: Get Static Web App deployment token
        id: deployment_token
        shell: pwsh
        env:
          AZURE_RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
        run: |
          if ([string]::IsNullOrWhiteSpace($Env:AZURE_RESOURCE_GROUP)) {
            throw 'AZURE_RESOURCE_GROUP must be configured'
          }
          
          $appName = az staticwebapp list `
            --resource-group $Env:AZURE_RESOURCE_GROUP `
            --query '[0].name' --output tsv --only-show-errors
          
            if ($LASTEXITCODE -ne 0) {
            throw 'Failed to list Static Web Apps'
          }
          
          if ([string]::IsNullOrWhiteSpace($appName) -or $appName -eq 'null') {
            throw "No Static Web App found in resource group $Env:AZURE_RESOURCE_GROUP"
          }
          
          $token = az staticwebapp secrets list `
            --name $appName `
            --resource-group $Env:AZURE_RESOURCE_GROUP `
            --query properties.apiKey --output tsv --only-show-errors
          
          if ($LASTEXITCODE -ne 0) {
            throw 'Failed to retrieve Static Web App deployment token'
          }
          if ([string]::IsNullOrWhiteSpace($token) -or $token -eq 'null') {
            throw 'Azure returned an empty Static Web App deployment token'
          }
          
          Write-Output "::add-mask::$token"
          Add-Content -Path $Env:GITHUB_OUTPUT -Value "token=$token" -Encoding utf8
      
      - name: Build And Deploy
        id: builddeploy
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ steps.deployment_token.outputs.token }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: "upload"
          app_location: "/terra-frontend"
          api_location: ""
          output_location: "dist"
